<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الملك - الذهب</title>
    <style>
        body { background: #3e0000; display: flex; flex-direction: column; align-items: center; color: #ffd700; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        h1 { text-shadow: 2px 2px 4px #000; }
        #multiplier { font-size: 1.8rem; font-weight: bold; margin: 10px 0; color: #fff; }
        #game-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; max-width: 450px; }
        .cell { aspect-ratio: 1/1; background: radial-gradient(circle, #ffd700, #b8860b); border: 4px solid #5d4037; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; cursor: pointer; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .revealed { background: #2b0000; border-color: #ffd700; box-shadow: none; }
        button { padding: 15px 40px; font-size: 1.3rem; margin-top: 20px; background: #8b0000; color: #ffd700; border: 2px solid #ffd700; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>لعبة الملك</h1>
    <div id="multiplier">المضاعف: 1.00</div>
    <div id="game-board"></div>
    <button onclick="location.reload()">بداية جديدة</button>

    <script>
        // الترتيب: 1 للطعام، 0 للسم (حسب طلبك من 1 لـ 25)
        const layout = [
            1,1,0,0,1, // 1-5
            1,1,1,0,0, // 6-10
            1,0,1,1,1, // 11-15
            1,0,1,0,1, // 16-20
            1,0,0,1,0  // 21-25
        ];
        const foods = ["🥩", "🍗", "🍕", "🫓", "🍰"];
        const mults = [1.21, 1.53, 1.96, 2.53, 3.33, 4.45, 6, 8.3, 11.8, 17.16, 25.74, 40, 65, 110, 200];
        let step = 0;

        const board = document.getElementById('game-board');
        layout.forEach(type => {
            const div = document.createElement('div');
            div.className = 'cell';
            div.onclick = () => {
                if(div.classList.contains('revealed')) return;
                div.classList.add('revealed');
                if(type === 1) {
                    div.innerHTML = foods[Math.floor(Math.random()*foods.length)];
                    document.getElementById('multiplier').innerText = "المضاعف: x" + mults[step++];
                } else {
                    div.innerHTML = "☠️";
                    alert("للأسف! سم.");
                }
            };
            board.appendChild(div);
        });
    </script>
</body>
</html>
