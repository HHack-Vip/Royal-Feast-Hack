<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الملك</title>
    <style>
        body { background: #3e0000; display: flex; flex-direction: column; align-items: center; color: #ffd700; font-family: sans-serif; padding: 20px; }
        #multiplier { font-size: 1.8rem; font-weight: bold; margin: 10px 0; color: #fff; }
        #game-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; max-width: 450px; }
        .cell { aspect-ratio: 1/1; background: radial-gradient(circle, #ffd700, #b8860b); border: 4px solid #5d4037; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; cursor: pointer; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .revealed { background: #2b0000; }
        button { padding: 15px 40px; font-size: 1.3rem; margin-top: 20px; background: #8b0000; color: #ffd700; border: 2px solid #ffd700; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>لعبة الملك</h1>
    <div id="multiplier">المضاعف: 1.00</div>
    <div id="game-board"></div>
    <button onclick="location.reload()">بداية جديدة</button>

    <script>
        // الترتيب الدقيق من 1 إلى 25 كما طلبت
        const layout = [
            "🍗", "🥩", "☠️", "☠️", "🍰", // 1-5
            "🍰", "🫓", "🍕", "☠️", "☠️", // 6-10
            "🍰", "☠️", "🍗", "🍕", "🫓", // 11-15
            "🍰", "☠️", "🍕", "☠️", "🫓", // 16-20
            "🥩", "☠️", "☠️", "🥩", "☠️"  // 21-25
        ];

        const mults = [1.21, 1.53, 1.96, 2.53, 3.33, 4.45, 6, 8.3, 11.8, 17.16, 25.74, 40, 65, 110, 200];
        let step = 0;

        const board = document.getElementById('game-board');
        layout.forEach(item => {
            const div = document.createElement('div');
            div.className = 'cell';
            div.onclick = () => {
                if(div.classList.contains('revealed')) return;
                div.classList.add('revealed');
                div.innerHTML = item;
                if(item !== "☠️") {
                    document.getElementById('multiplier').innerText = "المضاعف: x" + (mults[step++] || "200+");
                } else {
                    alert("للأسف! سم.");
                }
            };
            board.appendChild(div);
        });
    </script>
</body>
</html>
