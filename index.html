<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحظ المخصصة</title>
    <style>
        body { background: #2b0000; display: flex; flex-direction: column; align-items: center; color: white; font-family: sans-serif; padding: 15px; }
        #game-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 400px; }
        .cell { aspect-ratio: 1/1; background: #b8860b; border-radius: 8px; border: 2px solid #5d4037; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; cursor: pointer; }
        .cell.revealed { background: #3e2723; }
        button { padding: 15px 40px; font-size: 1.5rem; margin-top: 25px; background: #c62828; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>لعبة الحظ</h1>
    <div id="game-board"></div>
    <button onclick="location.reload()">بداية جديدة</button>

    <script>
        // الترتيب حسب طلبك (1 للطعام، 0 للسم)
        const layout = [
            1, 1, 0, 0, 1, // 1-5
            1, 1, 1, 0, 0, // 6-10
            1, 0, 1, 0, 1, // 11-15
            1, 0, 1, 0, 1, // 16-20
            1, 0, 0, 1, 0  // 21-25
        ];

        const foods = ["🥩", "🍗", "🍕", "🫓", "🍰"];
        const board = document.getElementById('game-board');
        
        layout.forEach((type) => {
            const div = document.createElement('div');
            div.className = 'cell';
            div.onclick = () => {
                if(div.classList.contains('revealed')) return;
                div.classList.add('revealed');
                div.innerHTML = type === 1 ? foods[Math.floor(Math.random()*foods.length)] : "☠️";
            };
            board.appendChild(div);
        });
    </script>
</body>
</html>
