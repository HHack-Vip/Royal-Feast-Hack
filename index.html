<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الملك</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #3e0000; color: #ffd700; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        
        .container { width: 100%; max-width: 400px; text-align: center; }
        .card { background: #2b0000; padding: 25px; border-radius: 20px; border: 2px solid #ffd700; box-shadow: 0 8px 16px rgba(0,0,0,0.6); }
        
        input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 8px; border: 1px solid #ffd700; background: #4a0000; color: white; font-size: 1.2rem; text-align: center; }
        .btn-3d { width: 100%; background: #b8860b; color: white; padding: 15px; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 6px #5d4037; font-size: 1.2rem; font-weight: bold; }
        .btn-3d:active { transform: translateY(4px); box-shadow: 0 2px #5d4037; }
        
        .hidden { display: none; }
        
        #game-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 20px; width: 100%; }
        .cell { aspect-ratio: 1/1; background: radial-gradient(circle, #ffd700, #b8860b); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; cursor: pointer; border: 2px solid #5d4037; }
        .revealed { background: #2b0000 !important; }
    </style>
</head>
<body>

    <div class="container">
        <div id="password-page" class="card">
            <h2>كلمة السر</h2>
            <input type="password" id="password" placeholder="أدخل الرمز">
            <button class="btn-3d" onclick="checkPassword()">دخول</button>
        </div>

        <div id="id-page" class="card hidden">
            <h2>أدخل الـ ID</h2>
            <input type="number" id="userid" placeholder="ID العميل">
            <button class="btn-3d" onclick="checkID()">تحقق</button>
        </div>

        <div id="game-page" class="hidden">
            <h2 id="multiplier">المضاعف: 1.00</h2>
            <div id="game-board"></div>
            <button class="btn-3d" style="margin-top:20px;" onclick="location.reload()">بداية جديدة</button>
        </div>
    </div>

    <script>
        const validPass = "448875";
        const validIDs = ["1658356877", "1690313233", "1501217291"];
        const layout = ["🍗", "🥩", "☠️", "☠️", "🍰", "🍰", "🫓", "🍕", "☠️", "☠️", "🍰", "☠️", "🍗", "🍕", "🫓", "🍰", "☠️", "🍕", "☠️", "🫓", "🥩", "☠️", "☠️", "🥩", "☠️"];
        const mults = [1.21, 1.53, 1.96, 2.53, 3.33, 4.45, 6, 8.3, 11.8, 17.16, 25.74, 40, 65, 110, 200];
        let step = 0;

        function checkPassword() {
            if(document.getElementById('password').value === validPass) {
                document.getElementById('password-page').classList.add('hidden');
                document.getElementById('id-page').classList.remove('hidden');
            } else { alert("رمز خطأ!"); }
        }

        function checkID() {
            if(validIDs.includes(document.getElementById('userid').value)) {
                document.getElementById('id-page').classList.add('hidden');
                document.getElementById('game-page').classList.remove('hidden');
                createBoard();
            } else { alert("ID غير مفعل!"); }
        }

        function createBoard() {
            const board = document.getElementById('game-board');
            layout.forEach(item => {
                const div = document.createElement('div');
                div.className = 'cell';
                div.onclick = () => {
                    if(div.classList.contains('revealed')) return;
                    div.classList.add('revealed');
                    div.innerHTML = item;
                    if(item !== "☠️") document.getElementById('multiplier').innerText = "المضاعف: x" + (mults[step++] || "200+");
                    else alert("للأسف! سم.");
                };
                board.appendChild(div);
            });
        }
    </script>
</body>
</html>
